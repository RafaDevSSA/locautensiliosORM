<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contrato de Locação</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="./contratosFirebase.js"></script>
    <link rel="stylesheet" href="css/salvar.css">
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #45a049;
            --text-color: #333;
            --light-gray: #f2f2f2;
            --border-color: #ddd;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: var(--text-color);
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .form-section {
            margin-bottom: 25px;
        }

        .form-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 16px;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -10px;
        }

        .col {
            flex: 1;
            padding: 0 10px;
            min-width: 200px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        .buttons {
            display: flex;
            justify-content: space-between;
        }

        .btn-secondary {
            background-color: #808080;
        }

        .btn-secondary:hover {
            background-color: #6c6c6c;
        }

        #preview-container {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: white;
        }

        #contract-preview {
            font-family: 'Times New Roman', Times, serif;
            line-height: 1.5;
            text-align: justify;
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .contract-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .signatures {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
        }

        .signature-line {
            width: 45%;
            text-align: center;
        }

        .line {
            border-bottom: 1px solid #000;
            margin-bottom: 5px;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
                margin: 10px;
                width: auto;
            }

            .col {
                flex: 100%;
                margin-bottom: 10px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                margin-bottom: 10px;
                width: 100%;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Contrato de Locação de Utensílios</h1>
            <p>Preencha os dados abaixo para gerar o contrato automaticamente</p>
        </div>

        <form id="rental-form">
            <div class="form-section">
                <div class="form-title">Dados do Locador</div>
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="locador-nome">Nome Completo:</label>
                            <input type="text" id="locador-nome" name="locador-nome" required
                                value="Raiana Araújo Valério">
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="locador-nacionalidade">Nacionalidade:</label>
                            <input type="text" id="locador-nacionalidade" name="locador-nacionalidade" required
                                value="brasileira">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="locador-estado-civil">Estado Civil:</label>
                            <select id="locador-estado-civil" name="locador-estado-civil" required>
                                <option value="solteiro(a)">Solteiro(a)</option>
                                <option value="casado(a)" selected>Casado(a)</option>
                                <option value="divorciado(a)">Divorciado(a)</option>
                                <option value="viúvo(a)">Viúvo(a)</option>
                                <option value="união estável">União Estável</option>
                            </select>
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="locador-cpf">CPF:</label>
                            <input type="text" id="locador-cpf" name="locador-cpf" required value="03483264590">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="locador-rg">RG:</label>
                            <input type="text" id="locador-rg" name="locador-rg" required value="1396890874">
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="locador-endereco">Endereço Completo:</label>
                            <input type="text" id="locador-endereco" name="locador-endereco" required
                                value="Rua Colônia Boa união -- Catu de Abrantes">
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-title">Dados do Locatário</div>
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="locatario-nome">Nome Completo:</label>
                            <input type="text" id="locatario-nome" name="locatario-nome" required>
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="locatario-cpf">CPF:</label>
                            <input type="text" id="locatario-cpf" name="locatario-cpf" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="locatario-rg">RG:</label>
                            <input type="text" id="locatario-rg" name="locatario-rg" required>
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="locatario-endereco">Endereço Completo:</label>
                            <input type="text" id="locatario-endereco" name="locatario-endereco" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-title">Detalhes da Locação</div>
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="desc-itens">Descrição dos itens alugados:</label>
                            <textarea id="desc-itens" name="desc-itens" required rows="10">
                                O presente contrato tem como objetos 100 pratos de porcelana 26cm (100)
com talheres, todas em bom estado de conservação e limpeza, de propriedade do(a)
LOCADOR, que serão locadas ao LOCATÁRIO.

                            </textarea>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="data-inicio">Data de Início:</label>
                            <input type="date" id="data-inicio" name="data-inicio" required>
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="duracao-dias">Duração (dias):</label>
                            <input type="number" id="duracao-dias" name="duracao-dias" min="1" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="local-retirada">Local de Retirada:</label>
                            <input type="text" id="local-retirada" name="local-retirada" required>
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="valor-aluguel">Valor do Aluguel (R$):</label>
                            <input type="number" id="valor-aluguel" name="valor-aluguel" step="0.01" min="0" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="taxa-dano">Taxa por Dano:</label>
                            <textarea id="taxa-dano" name="taxa-dano" required rows="10">
                               Em caso de danos, seguirá as seguintes taxas: R$3,00 unidade do talher, R$5,00 unidade da taça, R$10,00 unidade prato sobremesa e R$18,00 unidade prato raso 29cm a serem pagas no momento da devolução.
                            </textarea>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="multa-atraso">Multa por Atraso (R$/dia):</label>
                            <input type="number" id="multa-atraso" name="multa-atraso" step="0.01" min="0" required
                                value="50.00">
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="data-contrato">Data do Contrato:</label>
                            <input type="date" id="data-contrato" name="data-contrato" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="cidade-contrato">Cidade do Contrato:</label>
                            <input type="text" id="cidade-contrato" name="cidade-contrato" required value="Camaçari">
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="estado-contrato">Estado:</label>
                            <input type="text" id="estado-contrato" name="estado-contrato" required value="BA">
                        </div>
                    </div>
                </div>
            </div>

            <label class="salvar-linha" for="salvar-contrato">
                <span class="switch">
                    <input type="checkbox" id="salvar-contrato" checked role="switch">
                    <span class="slider"></span>
                </span>
                <span class="salvar-texto">
                    <strong>Salvar este contrato</strong>
                    <small class="salvar-ajuda"></small>
                </span>
            </label>

            <div class="buttons">
                <button type="button" id="back">voltar</button>
                <button type="button" id="verContratos">Ver contratos</button>
                <button type="button" id="preview-btn">Visualizar Contrato</button>
                <button type="button" id="generate-pdf-btn">Gerar PDF</button>
            </div>
        </form>

        <div id="preview-container">
            <div class="form-title">Pré-visualização do Contrato</div>
            <div id="contract-preview"></div>
            <label class="salvar-linha" for="salvar-contrato-preview">
                <span class="switch">
                    <input type="checkbox" id="salvar-contrato-preview" checked role="switch">
                    <span class="slider"></span>
                </span>
                <span class="salvar-texto">
                    <strong>Salvar este contrato</strong>
                    <small class="salvar-ajuda"></small>
                </span>
            </label>
            <div class="buttons">
                <button type="button" id="back-to-form-btn">Voltar ao Formulário</button>
                <button type="button" id="preview-generate-pdf-btn">Gerar PDF</button>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/contrato.js"></script>
    <script>
    (function () {
        'use strict';

        const C = window.LocaContrato;
        const U = window.LocaUtils;
        const $ = (id) => document.getElementById(id);

        // ---------- Salvar (chave) e geração do PDF ----------
        const AJUDA_LIGADO = 'Fica guardado em "Ver contratos" para gerar de novo com um clique.';
        const AJUDA_DESLIGADO = 'Só o PDF será gerado. Nada fica guardado no sistema.';

        function deveSalvar() { return $('salvar-contrato').checked; }

        function atualizarChave(origem) {
            const ligado = origem.checked;
            $('salvar-contrato').checked = ligado;
            $('salvar-contrato-preview').checked = ligado;
            document.querySelectorAll('.salvar-ajuda').forEach((el) => {
                el.textContent = ligado ? AJUDA_LIGADO : AJUDA_DESLIGADO;
            });
        }

        function comTimeout(promessa, ms) {
            return Promise.race([
                promessa,
                new Promise((_, rej) => setTimeout(() => rej(new Error('o servidor não respondeu a tempo')), ms))
            ]);
        }

        function formularioValido() {
            const form = $('rental-form');
            if (form.checkValidity()) return true;
            form.reportValidity();
            return false;
        }

        let gerando = false;
        async function gerar() {
            if (gerando || !formularioValido()) return;
            gerando = true;
            const botoes = document.querySelectorAll('#generate-pdf-btn, #preview-generate-pdf-btn');
            botoes.forEach((b) => { b.disabled = true; });
            const dados = C.lerFormulario(document);
            try {
                await C.gerarPDF(dados);
            } catch (e) {
                console.error('Erro ao gerar o PDF:', e);
                C.toast('Não foi possível gerar o PDF: ' + (e.message || e), 'erro');
                gerando = false;
                botoes.forEach((b) => { b.disabled = false; });
                return;
            }
            if (!deveSalvar()) {
                C.toast('PDF gerado. Este contrato não foi salvo.', 'aviso');
            } else {
                try {
                    await comTimeout(salvarContrato(dados), 15000);
                    C.toast('PDF gerado e contrato salvo em "Ver contratos".');
                } catch (e) {
                    console.error('Erro ao salvar o contrato:', e);
                    C.toast('PDF gerado, mas o contrato NÃO foi salvo: ' + (e.message || e), 'erro');
                }
            }
            gerando = false;
            botoes.forEach((b) => { b.disabled = false; });
        }

        $('salvar-contrato').addEventListener('change', (e) => atualizarChave(e.target));
        $('salvar-contrato-preview').addEventListener('change', (e) => atualizarChave(e.target));
        atualizarChave($('salvar-contrato'));

        // ---------- Eventos ----------
        $('back').addEventListener('click', () => { window.location.href = 'index.html'; });
        $('verContratos').addEventListener('click', () => { window.location.href = 'lista-contratos.html'; });

        $('preview-btn').addEventListener('click', () => {
            if (!formularioValido()) return;
            $('rental-form').style.display = 'none';
            $('preview-container').style.display = 'block';
            $('contract-preview').innerHTML = C.gerarHTML(C.lerFormulario(document));
        });

        $('back-to-form-btn').addEventListener('click', () => {
            $('rental-form').style.display = 'block';
            $('preview-container').style.display = 'none';
        });

        $('generate-pdf-btn').addEventListener('click', gerar);
        $('preview-generate-pdf-btn').addEventListener('click', gerar);
        $('rental-form').addEventListener('submit', (e) => e.preventDefault());

        // Data do contrato começa em hoje (pode ser alterada)
        if (!$('data-contrato').value) $('data-contrato').value = U.hojeISO();
    })();
    </script>
</body>

</html>
